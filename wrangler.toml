name = "doomerdash"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Not a credential: the project URL is public and the anon/publishable key that
# pairs with it is a secret below. Every actual key lives in Worker secrets.
[vars]
SUPABASE_URL = "https://oeekgxtqstyiudimglts.supabase.co"

# Secrets (set with `wrangler secret put <NAME>`):
#   SUPABASE_PUBLISHABLE_KEY  read path; only granted SELECT on the public views
#   SUPABASE_SERVICE_KEY      write path; used by ingest only
#   FRED_API_KEY              https://fred.stlouisfed.org/docs/api/api_key.html
#   INGEST_TOKEN              bearer token guarding POST /api/ingest

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[triggers]
crons = ["0 9 * * *"]

[observability]
enabled = true
